{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}RecipeVault{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'recipes/styles.css' %}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{% url 'recipes:list' %}">RecipeVault</a>
      <nav>
        <a href="{% url 'recipes:create' %}">Add recipe</a>
      </nav>
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      Served by container: {{ container_hostname }}
    </footer>
  </body>
</html>
